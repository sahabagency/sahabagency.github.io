name: Command Center Agents
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/command-center-agents.yml'
      - 'command-center/runtime/actions_worker.py'
      - 'command-center/runtime/test_actions_worker.py'
permissions:
  contents: read
concurrency:
  group: command-center-agents
  cancel-in-progress: false
jobs:
  configuration:
    name: Check configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required connections
        id: check
        env:
          CENTER_GOOGLE_CREDENTIALS: ${{ secrets.CENTER_GOOGLE_CREDENTIALS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          required = ("CENTER_GOOGLE_CREDENTIALS", "OPENAI_API_KEY")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=" + ("false" if missing else "true") + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if missing:
                  summary.write("## Waiting for configuration\n\n")
                  summary.write("Agent execution was skipped. Missing repository secrets\n\n")
                  summary.write("\n".join("- " + name for name in missing) + "\n")
              else:
                  summary.write("Required settings are present. Agent execution will validate them.\n")
          PY
  execute:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify queue behavior
        working-directory: command-center
        run: python -m unittest runtime.test_actions_worker
      - name: Install Google authentication
        run: pip install 'google-auth>=2.38,<3' 'requests>=2.32,<3'
      - name: Process private jobs
        working-directory: command-center
        env:
          CENTER_GOOGLE_CREDENTIALS: ${{ secrets.CENTER_GOOGLE_CREDENTIALS }}
          CENTER_SHEET_ID: 1QWkzo383aW1Px1YKluSRCElcgXq2WO-U83zuO9BAXFA
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CENTER_MODEL: ${{ vars.CENTER_MODEL }}
        run: python -m runtime.actions_worker
